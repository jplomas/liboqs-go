name: GitHub actions

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  repository_dispatch:
    types: ["**"]

env:
  BUILD_TYPE: Debug
  WIN_LIBOQS_INSTALL_PATH: C:/liboqs

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: 1.21

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: git mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja mingw-w64-x86_64-pkg-config

      - name: Install liboqs Windows
        shell: msys2 {0}
        run: |
          git clone --branch main --single-branch --depth 1 https://github.com/jplomas/liboqs
          cmake -S liboqs -B liboqs/build -G Ninja -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCMAKE_INSTALL_PREFIX=${{env.WIN_LIBOQS_INSTALL_PATH}} -DBUILD_SHARED_LIBS=ON -DOQS_BUILD_ONLY_LIB=ON -DCMAKE_C_FLAGS="-D__ORDER_LITTLE_ENDIAN__=1234 -D__ORDER_BIG_ENDIAN__=4321 -D__BYTE_ORDER__=1234"
          cmake --build liboqs/build --parallel 4
          cmake --build liboqs/build --target install

      - name: Configure pkgconfig Windows
        shell: msys2 {0}
        run: |
          mkdir -p /mingw64/lib/pkgconfig
          cp .config/liboqs-go.pc.win64 /mingw64/lib/pkgconfig/liboqs-go.pc

      - name: Run unit tests Windows
        shell: msys2 {0}
        env:
          CGO_ENABLED: 1
          CC: gcc
          PKG_CONFIG_PATH: /mingw64/lib/pkgconfig
        run: |
          export PATH="/c/liboqs/bin:$PATH"
          # Debug: show what pkg-config finds
          pkg-config --cflags --libs liboqs-go || echo "pkg-config failed"
          go test -v -run "TestSignatureCorrectness|TestSignatureCorrectnessWithCtxStr" ./oqstests
